<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Long-Term Plan Widget</title>
  <desc id="desc">A stylized preview of a compact Windows desktop planner with local data and optional voice input.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="1" stop-color="#12384a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#020617" flood-opacity=".5"/>
    </filter>
  </defs>
  <rect width="1200" height="520" rx="30" fill="url(#bg)"/>
  <circle cx="1054" cy="90" r="145" fill="#38bdf8" opacity=".08"/>
  <circle cx="1120" cy="430" r="205" fill="#34d399" opacity=".07"/>

  <g transform="translate(72 94)">
    <text x="0" y="0" fill="#7dd3fc" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700" letter-spacing="3">LOCAL-FIRST WINDOWS TOOL</text>
    <text x="0" y="66" fill="#f8fafc" font-family="Segoe UI, sans-serif" font-size="48" font-weight="750">Long-Term Plan Widget</text>
    <text x="0" y="112" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="23">计划贴在桌面边缘，数据只留在本机。</text>
    <rect x="0" y="156" width="154" height="40" rx="20" fill="#0e7490"/>
    <text x="77" y="182" text-anchor="middle" fill="#ecfeff" font-family="Segoe UI, sans-serif" font-size="16" font-weight="650">Plain JSON</text>
    <rect x="166" y="156" width="170" height="40" rx="20" fill="#047857"/>
    <text x="251" y="182" text-anchor="middle" fill="#ecfdf5" font-family="Segoe UI, sans-serif" font-size="16" font-weight="650">Auto-hide</text>
    <rect x="348" y="156" width="188" height="40" rx="20" fill="#334155"/>
    <text x="442" y="182" text-anchor="middle" fill="#f1f5f9" font-family="Segoe UI, sans-serif" font-size="16" font-weight="650">Optional voice</text>
    <text x="0" y="258" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="17">Python · Tkinter · MIT</text>
  </g>

  <g transform="translate(760 54)" filter="url(#shadow)">
    <rect width="366" height="414" rx="18" fill="#f8fafc"/>
    <rect width="366" height="8" rx="4" fill="url(#accent)"/>
    <text x="26" y="54" fill="#102033" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="25" font-weight="700">长期计划表</text>
    <text x="26" y="82" fill="#64748b" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13">计划中 2 项 · 已完成 1 项</text>
    <circle cx="298" cy="49" r="17" fill="#e0f2fe"/>
    <text x="298" y="55" text-anchor="middle" fill="#0369a1" font-family="Segoe UI Symbol, sans-serif" font-size="18">＋</text>
    <circle cx="334" cy="49" r="17" fill="#dcfce7"/>
    <text x="334" y="55" text-anchor="middle" fill="#047857" font-family="Segoe UI Symbol, sans-serif" font-size="16">●</text>

    <text x="26" y="122" fill="#334155" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" font-weight="700">计划中</text>
    <g transform="translate(22 140)">
      <rect width="322" height="78" rx="10" fill="#eaf4f7"/>
      <rect width="5" height="78" rx="3" fill="#1f6f8b"/>
      <text x="18" y="30" fill="#102033" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="16" font-weight="700">整理本周计划</text>
      <text x="18" y="56" fill="#526579" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12">拆成清晰、可以完成的小步骤</text>
      <rect x="286" y="17" width="19" height="19" rx="4" fill="none" stroke="#1f6f8b" stroke-width="2"/>
    </g>
    <g transform="translate(22 230)">
      <rect width="322" height="78" rx="10" fill="#eaf4f7"/>
      <rect width="5" height="78" rx="3" fill="#1f6f8b"/>
      <text x="18" y="30" fill="#102033" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="16" font-weight="700">复查项目文档</text>
      <text x="18" y="56" fill="#526579" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12">补充安装方式和隐私说明</text>
      <rect x="286" y="17" width="19" height="19" rx="4" fill="none" stroke="#1f6f8b" stroke-width="2"/>
    </g>
    <text x="26" y="344" fill="#334155" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" font-weight="700">已完成</text>
    <g transform="translate(22 359)">
      <rect width="322" height="38" rx="10" fill="#ecf6f0"/>
      <rect width="5" height="38" rx="3" fill="#4a866c"/>
      <text x="18" y="25" fill="#365c49" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14">完成开源说明</text>
      <rect x="286" y="10" width="18" height="18" rx="4" fill="#dcfce7" stroke="#4a866c"/>
      <path d="M290 19l4 4 7-9" fill="none" stroke="#337357" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>

